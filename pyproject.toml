[build-system]
requires = ["setuptools>=68", "versioningit~=3.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sabueso"
description = "Biomolecular knowledge integration into cards and decks traced to source assertions."
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "UIBCDF Lab", email = "uibcdf@gmail.com" }]
license = { text = "MIT" }
dynamic = ["version"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  # Reporting for agents and CI logs (MOLI developer-tools policy, uibcdf/sabueso#31).
  # Development tooling, not a runtime dependency; pinned to the published release.
  "pytest-receptor==1.1.0",
  "pyyaml>=6",
  "ruff==0.16.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sabueso*"]

[tool.pytest.ini_options]
markers = [
  "online: tests that require network access",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["MOLI_GUIDE.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.versioningit]
default-version = "0.0.0+unknown"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.vcs]
method = "git"
match = ["*"]
default-tag = "0.0.0"

[tool.versioningit.tag2version]
regex = "^(?P<version>(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*))$"
require-match = true

[tool.versioningit.write]
file = "sabueso/_version.py"
