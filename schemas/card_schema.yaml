# Sabueso card schema (conceptual, frozen draft)
# Every field is resolved from SourceAssertions: source_assertion_store + source_assertion_ids.
# A SourceAssertion records what an external source asserts about an entity or property.

schema:
  name: sabueso-card
  version: 0.2.0
  created_at: 2026-02-01
  updated_at: 2026-09-23
  note: "Conceptual schema. Types are illustrative; enforcement via code later."

card_base:
  meta:
    card_id: string
    entity_type: enum[protein, peptide, small_molecule]
    created_at: date
    updated_at: date
    version: string
    schema_version: string

  identifiers:
    primary_id:
      value: string
      source_assertion_ids: [string]
    secondary_ids:
      uniprot: { value: string, source_assertion_ids: [string] }
      pdb: { value: string, source_assertion_ids: [string] }
      chembl: { value: string, source_assertion_ids: [string] }
      pubchem: { value: string, source_assertion_ids: [string] }
      drugbank: { value: string, source_assertion_ids: [string] }
      chemspider: { value: string, source_assertion_ids: [string] }
      emolecules: { value: string, source_assertion_ids: [string] }
      other: [ { value: string, source_assertion_ids: [string] } ]

  names:
    canonical_name: { value: string, source_assertion_ids: [string] }
    synonyms: { value: [string], source_assertion_ids: [string] }

  summary:
    short_description: { value: string, source_assertion_ids: [string] }

  structure:
    sequences: { value: [string], source_assertion_ids: [string] }
    structures_3d:
      value: [ { pdb_id: string, file_ref: string, method: string, resolution: number } ]
      source_assertion_ids: [string]
    structures_2d:
      value: [ { format: string, file_ref: string } ]
      source_assertion_ids: [string]

  properties:
    physchem:
      molecular_weight: { value: number, source_assertion_ids: [string] }
      formula: { value: string, source_assertion_ids: [string] }
      isoelectric_point: { value: number, source_assertion_ids: [string] }
      logp: { value: number, source_assertion_ids: [string] }
      tpsa: { value: number, source_assertion_ids: [string] }
      hbd: { value: number, source_assertion_ids: [string] }
      hba: { value: number, source_assertion_ids: [string] }
      rotatable_bonds: { value: number, source_assertion_ids: [string] }
    bio:
      function: { value: string, source_assertion_ids: [string] }
      keywords: { value: [string], source_assertion_ids: [string] }

  annotations:
    pathways: { value: [string], source_assertion_ids: [string] }
    targets: { value: [string], source_assertion_ids: [string] }
    organism: { value: string, source_assertion_ids: [string] }
    domains: { value: [string], source_assertion_ids: [string] }
    families: { value: [string], source_assertion_ids: [string] }

  # Interactions are relationships, not fields: interacts_with (physical, e.g. IntAct)
  # and functionally_associated_with (STRING functional associations) (uibcdf/sabueso#21).
  # Measured bioactivities are has_bioactivity relationships (uibcdf/sabueso#23).

  references:
    publications: { value: [ { title: string, doi: string, pmid: string } ], source_assertion_ids: [string] }

  availability:
    vendors: { value: [string], source_assertion_ids: [string] }
    catalog_ids: { value: [string], source_assertion_ids: [string] }

  quality:
    conflicts: [ { field: string, source_assertion_ids: [string] } ]
    completeness_score: number
    confidence_score: number

  provenance:
    sources_consulted: [ { source: string, retrieved_at: date } ]
    query_inputs: [ { input_type: string, value: string } ]

  relationship_store:
    REL1:
      id: string                 # deterministic, REL_<hash>
      subject_ref: string
      predicate: "enum[same_as, possibly_same_as, isoform_of, superseded_by, has_structure]"
      object_ref: string
      qualifiers: any
      qualifier_conflicts: any   # values supporting sources disagree on
      source_assertion_ids: [string]   # when asserted by sources
      derivation: { rule: string, inputs: [string], parameters: any, sabueso_version: string }  # when inferred

  source_assertion_store:
    SA1:
      id: string
      subject_ref: string        # e.g. uniprot:P52789
      field_path: string
      asserted_value: any        # value as asserted by the source
      normalized_value: any      # value after Sabueso normalization, when different
      source: { type: "enum[database, literature, patent, curated, other]", name: string, record_id: string, version: string }
      retrieved_at: date
      source_metadata: any       # source-native qualifiers (e.g., UniProt ECO codes, PubMed IDs)
      provenance_ref: string     # optional
      timestamps: { published_at: date, updated_at: date }
      confidence: number         # only when reported by the source

  selection_rules:
    field_path:
      strategy: string
      preferred_sources: [string]
      tie_breaker: string


protein_card:
  inherits: card_base

  uniprot_comments:
    function: { value: string, source_assertion_ids: [string] }
    catalytic_activity: { value: [ { reaction: string, ec_number: string, rhea_id: string, molecule: string } ], source_assertion_ids: [string] }
    biophysicochemical_properties: { value: [string], source_assertion_ids: [string] }
    kinetics: { value: [string], source_assertion_ids: [string] }
    activity_regulation: { value: [string], source_assertion_ids: [string] }
    pathway: { value: [string], source_assertion_ids: [string] }
    subunit: { value: [string], source_assertion_ids: [string] }
    interaction: { value: [string], source_assertion_ids: [string] }
    subcellular_location: { value: [ { location: string, topology: string, orientation: string, molecule: string } ], source_assertion_ids: [string] }
    tissue_specificity: { value: [string], source_assertion_ids: [string] }
    ptm: { value: [string], source_assertion_ids: [string] }
    polymorphism: { value: [string], source_assertion_ids: [string] }
    sequence_caution: { value: [string], source_assertion_ids: [string] }
    alternative_products: { value: [string], source_assertion_ids: [string] }
    domain: { value: [string], source_assertion_ids: [string] }
    similarity: { value: [string], source_assertion_ids: [string] }
    miscellaneous: { value: [string], source_assertion_ids: [string] }
    caution: { value: [string], source_assertion_ids: [string] }
    web_resource: { value: [string], source_assertion_ids: [string] }

  disease:
    associations:
      value: [ { disease_id: string, name: string, source: string } ]
      source_assertion_ids: [string]

  ligands:
    value:
      - { ligand_id: string, name: string, role: string }
    source_assertion_ids: [string]

  features_positional:
    # Types observed in UniProt JSON for P52789, P35372, A0A140VJM9
    active_site: [ { location: { sequence: any, structure: any }, description: string, source_assertion_ids: [string] } ]
    alternative_sequence: [ { location: { sequence: any, structure: any }, description: string, source_assertion_ids: [string] } ]
    beta_strand: [ { location: { sequence: any, structure: any }, description: string, source_assertion_ids: [string] } ]
    binding_site: [ { location: { sequence: any, structure: any }, description: string, source_assertion_ids: [string] } ]
    chain: [ { location: { sequence: any, structure: any }, description: string, source_assertion_ids: [string] } ]
    disulfide_bond: [ { location: { sequence: any, structure: any }, description: string, source_assertion_ids: [string] } ]
    domain: [ { location: { sequence: any, structure: any }, description: string, source_assertion_ids: [string] } ]
    glycosylation: [ { location: { sequence: any, structure: any }, description: string, source_assertion_ids: [string] } ]
    helix: [ { location: { sequence: any, structure: any }, description: string, source_assertion_ids: [string] } ]
    lipidation: [ { location: { sequence: any, structure: any }, description: string, source_assertion_ids: [string] } ]
    modified_residue: [ { location: { sequence: any, structure: any }, description: string, source_assertion_ids: [string] } ]
    motif: [ { location: { sequence: any, structure: any }, description: string, source_assertion_ids: [string] } ]
    mutagenesis: [ { location: { sequence: any, structure: any }, description: string, source_assertion_ids: [string] } ]
    natural_variant: [ { location: { sequence: any, structure: any }, description: string, source_assertion_ids: [string] } ]
    region: [ { location: { sequence: any, structure: any }, description: string, source_assertion_ids: [string] } ]
    sequence_conflict: [ { location: { sequence: any, structure: any }, description: string, source_assertion_ids: [string] } ]
    topological_domain: [ { location: { sequence: any, structure: any }, description: string, source_assertion_ids: [string] } ]
    transmembrane: [ { location: { sequence: any, structure: any }, description: string, source_assertion_ids: [string] } ]
    turn: [ { location: { sequence: any, structure: any }, description: string, source_assertion_ids: [string] } ]

  # Experimental structures are has_structure relationships (relationship_store), shown
  # through Card.structures(). There are no scalar structure fields and no PDB-entry
  # cards (uibcdf/sabueso#6, #21).


peptide_card:
  inherits: protein_card
  note: "Peptide cards share UniProt structure but may omit PDB sections if no 3D entry exists."

  peptide_specific:
    origin:
      parent_protein: { value: string, source_assertion_ids: [string] }
      cleavage_site: { value: string, source_assertion_ids: [string] }
    activity:
      bioactivity: { value: [string], source_assertion_ids: [string] }
      potency: { value: [string], source_assertion_ids: [string] }


small_molecule_card:
  inherits: card_base

  identifiers:
    smiles: { value: string, source_assertion_ids: [string] }
    inchi: { value: string, source_assertion_ids: [string] }
    inchikey: { value: string, source_assertion_ids: [string] }

  properties:
    physchem:
      molecular_weight: { value: number, source_assertion_ids: [string] }
      formula: { value: string, source_assertion_ids: [string] }
      logp: { value: number, source_assertion_ids: [string] }
      tpsa: { value: number, source_assertion_ids: [string] }
      hbd: { value: number, source_assertion_ids: [string] }
      hba: { value: number, source_assertion_ids: [string] }
      rotatable_bonds: { value: number, source_assertion_ids: [string] }
      aromatic_rings: { value: number, source_assertion_ids: [string] }
      ro5_violations: { value: number, source_assertion_ids: [string] }

  bioactivity:
    targets: { value: [string], source_assertion_ids: [string] }
    assays: { value: [string], source_assertion_ids: [string] }
    activity_values: { value: [string], source_assertion_ids: [string] }

  clinical:
    pharmacology: { value: [string], source_assertion_ids: [string] }
    admet: { value: [string], source_assertion_ids: [string] }
    clinical_trials: { value: [string], source_assertion_ids: [string] }
    pharmacovigilance: { value: [string], source_assertion_ids: [string] }
    indications: { value: [string], source_assertion_ids: [string] }
    contraindications: { value: [string], source_assertion_ids: [string] }
    interactions: { value: [string], source_assertion_ids: [string] }

  availability:
    vendors: { value: [string], source_assertion_ids: [string] }
    catalog_ids: { value: [string], source_assertion_ids: [string] }
    packaging: { value: [string], source_assertion_ids: [string] }
