name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Offline tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows on every supported Python; macOS on the routine one.
        # Sabueso is noarch: one package for every platform, so each platform it claims
        # needs representative evidence (MOLI Python CI policy).
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Dependencies come from the uibcdf and conda-forge channels, as for users; only
      # Sabueso itself is installed with pip (uibcdf/sabueso#34).
      - uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=${{ matrix.python-version }}
      - name: Install Sabueso
        shell: bash -l {0}
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Smoke the installed package outside the checkout
        # Tests run from the repository root, where `import sabueso` finds the checkout;
        # this step reads the installed package, which is what users get (#35).
        shell: bash -l {0}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cd "$(cygpath -u "$RUNNER_TEMP")"
          else
            cd "$RUNNER_TEMP"
          fi
          python -c "import sabueso; from sabueso.resolver import load_selection_rules; assert 'site-packages' in sabueso.__file__, sabueso.__file__; assert load_selection_rules()['field_rules']"
      - name: Environment
        shell: bash -l {0}
        run: |
          python --version
          micromamba list | grep -E "^ *(python|pytest|pytest-receptor) " || true
      - name: Run offline tests
        shell: bash -l {0}
        run: python -m pytest -m "not online" --receptor=ci

  quality:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install quality tooling
        run: python -m pip install "ruff==0.16.5"
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
