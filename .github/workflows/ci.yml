name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Offline tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Dependencies come from the uibcdf and conda-forge channels, as for users; only
      # Sabueso itself is installed with pip (uibcdf/sabueso#34).
      - uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=${{ matrix.python-version }}
      - name: Install Sabueso
        shell: bash -l {0}
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Environment
        shell: bash -l {0}
        run: |
          python --version
          micromamba list | grep -E "^ *(python|pytest|pytest-receptor) " || true
      - name: Run offline tests
        shell: bash -l {0}
        run: python -m pytest -m "not online" --receptor=ci

  quality:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install quality tooling
        run: python -m pip install "ruff==0.16.5"
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
