name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Offline tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Sabueso with test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run offline tests
        run: python -m pytest -m "not online" --receptor=ci

  quality:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install quality tooling
        run: python -m pip install "ruff==0.16.5"
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
