name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ackredit-pilot:
    name: Ackredit public-package pilot (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Normal installed provider tests on every supported Python minor (#80).
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=${{ matrix.python-version }}
            uibcdf::ackredit=0.9.0=py_0
      - name: Install the consumer with the public provider
        shell: bash -l {0}
        run: |
          python -m pip install --no-deps --no-build-isolation .
      - name: Verify installed imports outside both checkouts
        shell: bash -l {0}
        run: |
          cd "$RUNNER_TEMP"
          python -c "import ackredit,sabueso; assert 'site-packages' in ackredit.__file__, ackredit.__file__; assert 'site-packages' in sabueso.__file__, sabueso.__file__; assert callable(ackredit.capture)"
      - name: Exercise the installed required provider and consumer
        shell: bash -l {0}
        run: |
          client_dir="$RUNNER_TEMP/ackredit-client"
          mkdir -p "$client_dir"
          cp tests/core/test_attribution_offline.py "$client_dir/"
          cp tests/core/test_source_acquisition_offline.py "$client_dir/"
          cp tests/core/test_rcsb_acquisition_offline.py "$client_dir/"
          cp tests/core/test_chembl_acquisition_offline.py "$client_dir/"
          cp tests/core/test_pubchem_acquisition_offline.py "$client_dir/"
          cp tests/core/test_bindingdb_acquisition_offline.py "$client_dir/"
          cp tests/core/test_disease_explanation_offline.py "$client_dir/"
          cp tests/core/test_knowledge_state_explanation_offline.py "$client_dir/"
          cp tests/core/test_bioactivity_explanation_offline.py "$client_dir/"
          cp tests/core/test_rule_literature_extraction_offline.py "$client_dir/"
          cp tests/core/test_literature_intake_offline.py "$client_dir/"
          ln -s "$GITHUB_WORKSPACE/temp_data" "$client_dir/temp_data"
          cd "$client_dir"
          python -m pytest test_attribution_offline.py test_source_acquisition_offline.py test_rcsb_acquisition_offline.py test_chembl_acquisition_offline.py test_pubchem_acquisition_offline.py test_bindingdb_acquisition_offline.py test_disease_explanation_offline.py test_knowledge_state_explanation_offline.py test_bioactivity_explanation_offline.py test_rule_literature_extraction_offline.py test_literature_intake_offline.py -m "not online" --receptor=ci
      - name: Run the public offline workflow
        shell: bash -l {0}
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/examples/ackredit_pilot/run.py" \
            --fixtures "$GITHUB_WORKSPACE/temp_data" --output "$RUNNER_TEMP/ackredit-pilot"

  test:
    name: Offline tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows on every supported Python; macOS on the routine one.
        # Sabueso is noarch: one package for every platform, so each platform it claims
        # needs representative evidence (MOLI Python CI policy).
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-26
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify Apple Silicon macOS runner
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = arm64
      # All required dependencies, including the portable provider, come from public Conda.
      - uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=${{ matrix.python-version }}
      - name: Install Sabueso with public runtime dependencies
        shell: bash -l {0}
        run: |
          python -m pip install --no-deps --no-build-isolation .
      - name: Smoke the installed package outside the checkout
        # Tests run from the repository root, where `import sabueso` finds the checkout;
        # this step reads the installed package, which is what users get (#35).
        shell: bash -l {0}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cd "$(cygpath -u "$RUNNER_TEMP")"
          else
            cd "$RUNNER_TEMP"
          fi
          python -c "import ackredit,sabueso; from sabueso.resolver import load_selection_rules; assert 'site-packages' in sabueso.__file__, sabueso.__file__; assert 'site-packages' in ackredit.__file__, ackredit.__file__; assert callable(ackredit.capture); assert load_selection_rules()['field_rules']"
      - name: Environment
        shell: bash -l {0}
        run: |
          python --version
          micromamba list | grep -E "^ *(python|pytest|pytest-receptor) " || true
      - name: Run offline tests
        shell: bash -l {0}
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          if [[ "$RUNNER_OS" == "Linux" && "$PYTHON_VERSION" == "3.14" ]]; then
            python -m pytest -m "not online" --receptor=ci \
              --cov=sabueso --cov-branch --cov-report=xml:coverage.xml
          else
            python -m pytest -m "not online" --receptor=ci
          fi
      - name: Retain measured coverage XML
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  coverage-upload:
    name: Publish default-branch coverage
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage-xml
          path: coverage-report
      - name: Upload the measured report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-report/coverage.xml
          disable_search: true
          fail_ci_if_error: true

  quality:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Dependency-contract preflight
        # Standard library only: every route that installs the runtime agrees with
        # pyproject.toml (uibcdf/sabueso#76, MOLI distribution policy).
        run: python devtools/dependency_preflight.py
      - name: Install quality tooling
        run: python -m pip install "ruff==0.16.5"
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
