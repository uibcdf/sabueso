name: CI capacity diagnosis (manual)

# This observes capacity only. Its outcome never qualifies scientific tests or CI.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENMM_CPU_THREADS: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  NUMBA_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  POLARS_MAX_THREADS: "1"
  RAYON_NUM_THREADS: "1"

jobs:
  capacity:
    name: Observe macOS capacity without pytest
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify Apple Silicon macOS runner
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = arm64
      - uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: python=3.14
      - name: Install Sabueso with public runtime dependencies
        shell: bash -l {0}
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Smoke the installed package outside the checkout
        shell: bash -l {0}
        run: |
          cd "$RUNNER_TEMP"
          python -c "import ackredit,sabueso; from sabueso.resolver import load_selection_rules; assert 'site-packages' in sabueso.__file__, sabueso.__file__; assert 'site-packages' in ackredit.__file__, ackredit.__file__; assert callable(ackredit.capture); assert load_selection_rules()['field_rules']"
      - name: Environment
        shell: bash -l {0}
        run: |
          python --version
          micromamba list | grep -E "^ *(python|pytest|pytest-receptor) " || true
      - name: Check reviewed fixture publication scope
        shell: bash -l {0}
        run: python tools/fixture_delivery.py --check
      - name: Qualify and emit Zstandard cross-reader frames
        shell: bash -l {0}
        run: python devtools/probe_zstd_backend.py emit
      - name: Exercise installed exploration transport outside the checkout
        shell: bash -l {0}
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/devtools/check_exploration_transport.py" --installed
      - name: Observe capacity without starting pytest
        shell: bash -l {0}
        run: |
          python "$GITHUB_WORKSPACE/devtools/run_ci_pytest.py" --preflight-only --workers 3 \
            --report "$RUNNER_TEMP/sabueso-ci-capacity.json"
      - name: Retain capacity observation even on refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-capacity-observation
          path: ${{ runner.temp }}/sabueso-ci-capacity.json
          if-no-files-found: warn
          retention-days: 14
