[package]
name = "sabueso-standalone-probe"
version = "0.0.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[features]
webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[profile.dev]
debug = 0
incremental = false
