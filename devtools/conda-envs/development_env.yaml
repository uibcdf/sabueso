# Development environment for Sabueso (uibcdf/sabueso#34). Users install the package
# from the uibcdf conda channel; pip is only for the local editable install:
#   conda env create -n sabueso-dev -f devtools/conda-envs/development_env.yaml
#   conda activate sabueso-dev
#   pip install --no-deps --editable .
channels:
- uibcdf
- conda-forge
dependencies:
- python >=3.11,<3.15
- smonitor >=0.16.0
- pyunitwizard >=0.27.0
- pip
- setuptools >=61.0
- versioningit ~=3.0
- pytest >=8
- pytest-receptor ==1.1.0
- pyyaml >=6
- ruff ==0.16.5
- pytest-cov
- codecov
- pytest-xdist
- jupyterlab
- sphinx
- pydata-sphinx-theme
- sphinxcontrib-bibtex
- sphinx-remove-toctrees
- sphinx-copybutton
- sphinx-design
- sphinx-favicon
- sphinx-tabs
- myst-nb
- mamba
