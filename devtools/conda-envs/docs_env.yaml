# Environment to build Sabueso's documentation (uibcdf/sabueso#34).
#   conda env create -f devtools/conda-envs/docs_env.yaml
#   pip install --no-deps --editable .
#   make -C docs html
channels:
  - uibcdf
  - conda-forge

dependencies:
  - python >=3.11,<3.15
  - smonitor >=0.16.0
  - pyunitwizard >=0.27.0
  - argdigest >=0.13.0
  - depdigest >=0.11.0
  - pandas >=2   # optional; exercised by the table tests (#46)
  - pip
  - setuptools >=68
  - versioningit ~=3.0
  - pyyaml >=6
  - sphinx
  - pydata-sphinx-theme
  - sphinxcontrib-bibtex
  - sphinx-remove-toctrees
  - sphinx-copybutton
  - sphinx-design
  - sphinx-favicon
  - sphinx-tabs
  - myst-nb
