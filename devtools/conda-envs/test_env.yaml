# Environment for Sabueso's offline tests in CI (uibcdf/sabueso#34).
# Runtime dependencies (as in pyproject.toml and the recipe) plus test tooling.
channels:
  - uibcdf
  - conda-forge

dependencies:
  - python >=3.11,<3.15
  - smonitor >=0.16.0
  - pyunitwizard >=0.27.0
  - argdigest >=0.13.0
  - pip
  - setuptools >=68
  - versioningit ~=3.0
  - wheel
  - pytest >=8
  - pytest-receptor ==1.1.0
  - pyyaml >=6
