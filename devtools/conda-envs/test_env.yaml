# Environment for Sabueso's offline tests in CI (uibcdf/sabueso#34).
# UIBCDF support libraries join here as #31 records each applicable use.
channels:
  - uibcdf
  - conda-forge

dependencies:
  - python >=3.11,<3.15
  - pip
  - setuptools >=68
  - versioningit ~=3.0
  - wheel
  - pytest >=8
  - pytest-receptor ==1.1.0
  - pyyaml >=6
