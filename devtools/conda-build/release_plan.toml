reason = "Integrity fix that affects users of 0.5.0: STRING answers cut at the default limit passed for the whole answer (70fc142); every cut is now recorded and reported, and defaults ask for everything up to 5000 items (#88). New knowledge: card schema 0.3.6 (isoforms, secondary structure, curated biological context, pathogen phenotypes, clinical variants, population variants), eight new sources (PHI-base, DISEASES, Open Targets, Orphanet, Reactome, ClinVar, gnomAD, ClinicalTrials.gov), variant placement through stated transcripts and UniProt isoform maps (#83, #85), knowledge packets (#71), declared enrichers with shared network, release-cache and key services (#86). First publication of card schema 0.3.6. Clean installed-package gates, Windows included, must pass before public visibility."
