    links: ["#81", "#83"]
  - id: medgen
    name: "MedGen (NCBI)"
    url: https://www.ncbi.nlm.nih.gov/medgen/
    category: target_validation
    status: in_use
    description: "NCBI's portal of medical genetics concepts, integrating UMLS, OMIM, Orphanet, HPO, MONDO and other vocabularies."
    since: 2026-09-29
    proposed_by: "Foundational route: the disease as an entity (#90)"
    reason: "Which MedGen record (UID) each MedGen concept id is, as MedGen states it, so that a condition ClinVar names only by a MedGen concept id reaches MONDO, whose equivalences name MedGen records by UID (rule medgen_concept@1). Only the ids are kept."
    access: "E-utilities (esearch by [ConceptId], esummary), in batches, optional NCBI key, when resolve(..., medgen=True)"
    licence: "US public domain (NLM policy) for NCBI's records; names from integrated vocabularies may carry their own terms and are not kept"
    terms:
      source_names: ["MedGen"]
      licence: US-PD
      attribution: "MedGen, National Library of Medicine (https://www.ncbi.nlm.nih.gov/medgen/)"
      statement: https://www.ncbi.nlm.nih.gov/home/about/policies/
      reviewed: 2026-09-29
      caveats:
        - "Names from integrated vocabularies may carry their own terms; Sabueso keeps only ids."
    module: [sabueso.tools.db.medgen, sabueso.mappings.medgen]
    links: ["#90"]
  - id: mondo
    name: "MONDO (Mondo Disease Ontology)"
    url: https://mondo.monarchinitiative.org/
    category: target_validation
    status: in_use
    description: "A disease ontology integrating DOID, Orphanet, OMIM, NCIT, MeSH, EFO, ICD, MedGen and others, with stated equivalences to each."
    since: 2026-09-29
    proposed_by: "Foundational route: the disease as an entity (#90)"
    reason: "The anchor of disease cards, and the identity of the diseases on protein cards (disease_identity, Card.diseases()). An external disease id joins a MONDO term only through an equivalence MONDO states (MONDO:equivalentTo, rule mondo_equivalence@1); related xrefs are kept apart and never read as identity."
    access: "Dated GitHub releases; mondo.obo (about 53 MB) downloaded once per process, checked against the SHA-256 GitHub states, and indexed; resolve('mondo:...'), or any id of a terminology MONDO maps"
    licence: "CC BY 4.0 (cite Mondo and the release)"
    terms:
      source_names: ["MONDO"]
      licence: CC-BY-4.0
      attribution: "Mondo Disease Ontology, Monarch Initiative (https://mondo.monarchinitiative.org/), CC BY 4.0"
      statement: https://mondo.monarchinitiative.org/
      reviewed: 2026-09-29
    module: [sabueso.tools.db.mondo, sabueso.mappings.mondo]
    links: ["#90"]
