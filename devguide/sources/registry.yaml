    reason: Protein identity anchor and primary annotation source.
    access: REST API (entries and search)
    limit:
      constant: sabueso.tools.db.uniprot.SEARCH_SIZE
      of: candidates of a name or gene search (kept low on purpose; more than this is ambiguous, and the resolution records search_truncated)
    licence: CC BY 4.0
    terms:
      source_names: ["UniProt"]
      licence: CC-BY-4.0
      attribution: "UniProtKB, UniProt Consortium (https://www.uniprot.org/), CC BY 4.0"
      statement: https://rest.uniprot.org/help/license
