    since: 2026-09-23
    requires: ["account", "academic_licence"]
    requires_note: "An account under DrugBank's Academic License to download the full data (CC BY-NC 4.0); the CC0 Open Data also needs a login."
    reason: "Reviewed for terms profiles (2026-09-29, #94). The full database (XML 5.1.22 of 2026-06-27, 204 MB) is CC BY-NC 4.0, and its download needs an account under DrugBank's Academic License (an academic institution, research not primarily for a commercial third party). It would fit only the non_commercial profile, with the user's own account, and would bring what the clinical layer still lacks: pharmacology, mechanisms, interactions, transporters. The Open Data (vocabulary, structures) is CC0, but its download also needs a login (HTTP 403 without one)."
    revisit_when: "A user with a DrugBank academic account asks for it; the account's credentials are theirs, through tools/db/_keys, never stored."
    access: Downloads under an account (HTTP basic authentication with the user's email and password)
    licence: Open data (vocabulary, structures) CC0; full database CC BY-NC 4.0, under DrugBank's Academic License, or commercial
