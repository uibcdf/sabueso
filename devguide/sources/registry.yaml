    since: 2026-01-31
    proposed_by: "Original plan: clinical layer and use case 8 (clinical trials for ligands)"
    reason: "The clinical layer of molecule cards (#81). Studies name interventions only as text, so Sabueso asks only for the NCT ids ChEMBL's drug indications cite, and never matches a trial to a molecule by name."
    access: "API v2 (studies by NCT id, in batches), no key, when resolve(..., trials={})"
    limit:
      constant: sabueso.tools.card.small_molecule.DEFAULT_TRIAL_LIMIT
