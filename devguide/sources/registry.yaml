# Online resources Sabueso uses, has set aside, or has yet to review.
#
# This file is the source of truth. docs/content/user/data_sources.md is generated from it
# (python tools/source_registry.py --write), and tests/core/test_source_registry_offline.py
# checks it: every source module in sabueso.tools.db is an in_use entry, and every
# decision states its reason.
#
# Proposals arrive through GitHub Discussions (category "Data sources"); triage adds them
# here as queued and links the discussion. Every later decision is written here, with
# its date and reason, never only in a thread. Reasons stay generic: this repository is
# public.
#
# Statuses:
#   in_use        Sabueso reads it, directly (a tools.db module) or through another
#                 source's cross-references (via).
#   evaluating    Someone is checking access, licence, coverage and fit.
#   queued        Proposed, not yet reviewed.
#   deferred      Useful, set aside for now; revisit_when says when to look again.
#   rejected      Not suitable; reason says why.
#   retired       Was used, no longer is; reason says why.
#   out_of_scope  Not a knowledge source for Sabueso; owner names the MOLI component
#                 it belongs to.
#
# Optional keys:
#   limit         For a source whose answer Sabueso caps by default: the code constant
#                 that holds the cap (constant) and what it counts (of). The page reads
#                 the value from the code, so the two cannot disagree. A cut is always
#                 recorded as truncated and reported.
#   note          The state of a review, e.g. why an evaluation is blocked.
#   requires      What access needs from a user (#94): account, key, academic_licence
#                 (an institution-based licence), licence, or agreement (a written
#                 one); requires_note says what, in a sentence. Listed on the data
#                 sources page, so a user knows what to obtain before asking for it.
#   terms         What the source states about the use of its data (#29): the
#                 SourceAssertion source_names it covers, a licence classified in
#                 sabueso/core/terms.py (LICENCES), the attribution text, the
#                 statement's URL, the date it was reviewed, and caveats; and, for a
#                 source whose records keep their depositor's terms, depositors: each
#                 depositor whose terms are known, to the source whose terms apply.
#                 Exported to
#                 sabueso/resolver/source_terms.json; every source Sabueso reads states
#                 them.
format: 1
categories:
  targets_sequence: Targets, sequence and basic pharmacology
  target_validation: Target validation, genetics and functional networks
  interactions: Protein–protein interactions and structural modulation
  structures_models: Macromolecular structures, models and dynamics
  sites_families: Binding sites, cavities and specialised families
  bioactivity: Binding affinity and experimental bioactivity
  benchmarks: Benchmarks, open challenges and open-science consortia
  emerging_modalities: Emerging modalities (targeted degradation)
  chemistry_admet: Chemical space, synthesis, ADMET and safety
  organism_context: Organism, orthology and biological context
  software: Open-source software ecosystems
  literature: Literature and text mining
